dataset: pawsfirst/gold/fact_clin_appointment

columns:
  - name: appointment_id
    data_type: integer
    checks:
      - missing:
          name: appointment_id is always populated

  - name: clinic_id
    data_type: integer
    checks:
      - missing:
          name: clinic_id is always populated

  - name: appointment_week_start_date
    data_type: date
    checks:
      - missing:
          name: appointment_week_start_date is always populated

checks:
  - schema:
      name: Schema matches expected structure
      allow_extra_columns: true
      allow_other_column_order: true

  - row_count:
      name: At least 6000 gold appointment fact rows
      threshold:
        must_be_greater_than: 6000
