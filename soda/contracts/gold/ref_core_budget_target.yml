dataset: pawsfirst/gold/ref_core_budget_target

columns:
  - name: clinic_id
    data_type: integer
    checks:
      - missing:
          name: clinic_id is always populated

  - name: budget_month_start_date
    data_type: date
    checks:
      - missing:
          name: budget_month_start_date is always populated

  - name: target_revenue_amount
    data_type: double
    checks:
      - missing:
          name: target_revenue_amount is always populated

checks:
  - schema:
      name: Schema matches expected structure
      allow_extra_columns: true
      allow_other_column_order: true

  - row_count:
      name: At least 100 gold budget target rows
      threshold:
        must_be_greater_than: 100
