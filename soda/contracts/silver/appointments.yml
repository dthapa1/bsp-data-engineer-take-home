dataset: pawsfirst/silver/stg_vet_appointment

columns:
  - name: appointment_id
    data_type: integer
    checks:
      - missing:
          name: appointment_id is always populated

  - name: clinic_id
    data_type: integer
    checks:
      - missing:
          name: clinic_id is always populated

  - name: appointment_week_start
    data_type: date
    checks:
      - missing:
          name: appointment_week_start is always populated

  - name: status
    data_type: varchar
    checks:
      - missing:
          name: status is always populated

checks:
  - schema:
      name: Schema matches expected structure
      allow_extra_columns: true
      allow_other_column_order: true

  - row_count:
      name: At least 6000 silver appointment records
      threshold:
        must_be_greater_than: 6000
