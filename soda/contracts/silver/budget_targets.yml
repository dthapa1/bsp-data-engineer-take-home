dataset: pawsfirst/silver/stg_vet_budget_target

columns:
  - name: clinic_id
    data_type: integer
    checks:
      - missing:
          name: clinic_id is always populated

  - name: budget_month_start
    data_type: date
    checks:
      - missing:
          name: budget_month_start is always populated

  - name: target_revenue
    data_type: double
    checks:
      - missing:
          name: target_revenue is always populated

checks:
  - schema:
      name: Schema matches expected structure
      allow_extra_columns: true
      allow_other_column_order: true

  - row_count:
      name: At least 100 silver budget target records
      threshold:
        must_be_greater_than: 100
