dataset: pawsfirst/silver/stg_vet_referral

columns:
  - name: referral_id
    data_type: integer
    checks:
      - missing:
          name: referral_id is always populated

  - name: clinic_id
    data_type: integer
    checks:
      - missing:
          name: clinic_id is always populated

  - name: stage
    data_type: varchar
    checks:
      - missing:
          name: stage is always populated

  - name: stage_rank
    data_type: integer
    checks:
      - missing:
          name: stage_rank is always populated

checks:
  - schema:
      name: Schema matches expected structure
      allow_extra_columns: true
      allow_other_column_order: true

  - row_count:
      name: At least 2000 silver referral stage records
      threshold:
        must_be_greater_than: 2000
